<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>聖經故事大全</title>
<meta name="description" content="西洋繪畫與雕刻裡的聖經：365 則故事、人物關係圖，以及看圖找故事。">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
:root{
  --bg:#1b1a20; --bg2:#232229; --panel:#2a2931; --line:#3d3b46; --fg:#ece7dc; --muted:#a59f92; --accent:#c9a35a; --accent2:#8fa9cc; --danger:#c96b5c; --warm:#2a2318;
  --serif:"Noto Serif TC","Cormorant Garamond",Georgia,"PMingLiU",serif; --sans:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; --latin:"Cormorant Garamond",Georgia,serif;
  --rf:1rem; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f5f0e4;--bg2:#ece6d6;--panel:#fffdf7;--line:#d9d1bf;--fg:#211d17;--muted:#6c655a;--accent:#8c6a22;--accent2:#355f85;--danger:#a3422f;--warm:#f7efd9;color-scheme:light}}
:root[data-theme="light"]{--bg:#f5f0e4;--bg2:#ece6d6;--panel:#fffdf7;--line:#d9d1bf;--fg:#211d17;--muted:#6c655a;--accent:#8c6a22;--accent2:#355f85;--danger:#a3422f;--warm:#f7efd9;color-scheme:light}
:root[data-theme="night"]{--bg:#120f0a;--bg2:#1a1510;--panel:#211a12;--line:#3a2f22;--fg:#e9dcc3;--muted:#a08f72;--accent:#d9a44a;--accent2:#c9a26f;--warm:#241c12;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.7}
a{color:var(--accent2)}
h1,h2,h3{font-family:var(--serif);font-weight:700;text-wrap:balance;margin:0}
button{font:inherit}
.top{position:sticky;top:0;z-index:9;background:var(--bg2);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:1.35rem;letter-spacing:.04em;cursor:pointer}
.brand .lat{font-family:var(--latin);font-style:italic;color:var(--muted);font-size:1rem}
.brand .stat{margin-left:auto;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:8px;scrollbar-width:none;align-items:center}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font-weight:500;padding:8px 12px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs .sp{margin-left:auto}
.tabs .tool{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.8rem;color:var(--fg);background:var(--panel);margin-left:4px}
main{padding:18px max(16px,env(safe-area-inset-right,0px)) 70px max(16px,env(safe-area-inset-left,0px));max-width:1400px;margin:0 auto}
.lead{color:var(--muted);max-width:70ch;margin:0 0 14px}
.lbl{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:var(--latin);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;color:inherit;text-align:left;padding:0;display:flex;flex-direction:column;min-width:0}
.card:hover{border-color:var(--accent)}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--bg);display:block}
.card .b{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.card h3{font-size:1.08rem}
.card .en{font-family:var(--latin);font-style:italic;color:var(--muted);font-size:.95rem}
.card .meta{font-size:.78rem;color:var(--muted)}
.card .sum{font-size:.88rem;color:var(--fg);opacity:.85}
.cyc{border-left:6px solid var(--cc,var(--accent))}
.hero{background:linear-gradient(135deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:8px;padding:22px;display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:center;margin-bottom:20px}
.hero h2{font-size:1.6rem;margin-bottom:6px}
.hero .big{background:var(--accent);color:#1b1a20;border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;font-size:1rem}
.hero img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:6px;background:var(--bg)}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.8rem;background:var(--bg2);color:var(--fg);cursor:pointer}
.chip.on,.chip:hover{border-color:var(--accent);color:var(--accent)}
.sec{margin:26px 0 10px;display:flex;align-items:baseline;gap:10px}
.sec h2{font-size:1.3rem}
.sec .more{margin-left:auto;font-size:.85rem}
/* story */
.story{max-width:760px;margin:0 auto}
.story .head{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
.story h2{font-size:calc(var(--rf)*1.9);line-height:1.3}
.story .en{font-family:var(--latin);font-style:italic;color:var(--muted);font-size:1.15rem}
.story .meta{color:var(--muted);font-size:.85rem;display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.story .hook{font-family:var(--serif);font-size:calc(var(--rf)*1.25);line-height:1.8;margin:14px 0;color:var(--accent)}
.story h3{font-size:calc(var(--rf)*1.25);margin:26px 0 8px;color:var(--accent)}
.story p{font-size:calc(var(--rf)*1.08);line-height:1.95;margin:0 0 1em;text-align:justify}
.story figure{margin:22px 0;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:zoom-in}
.story figure img{width:100%;max-height:560px;object-fit:contain;background:var(--bg);display:block}
.story figcaption{padding:8px 12px;font-size:.82rem;color:var(--muted)}
.story .ending{background:var(--warm);border-radius:8px;padding:16px 18px;font-family:var(--serif);font-size:calc(var(--rf)*1.12);line-height:1.95;margin:22px 0}
.note{background:var(--bg2);border:1px dashed var(--line);border-radius:6px;padding:12px 14px;font-size:.92rem;color:var(--fg);margin:16px 0}
.note b{color:var(--accent)}
.strip{display:flex;gap:10px;overflow-x:auto;padding:6px 0 10px}
.strip img{height:150px;border-radius:4px;background:var(--bg);cursor:zoom-in;flex:0 0 auto}
.nav2{display:flex;justify-content:space-between;gap:10px;margin:28px 0 0}
.nav2 button{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:8px 12px;cursor:pointer;max-width:48%;text-align:left}
.back{background:none;border:0;color:var(--accent2);cursor:pointer;padding:0;margin-bottom:10px}
/* characters */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;color:inherit;text-align:left;min-width:0}
.ccard:hover{border-color:var(--accent)}
.ccard h3{font-size:1.02rem}
.ccard .en{font-family:var(--latin);font-style:italic;color:var(--muted);font-size:.9rem}
.ccard .d{font-size:.8rem;color:var(--muted);margin-top:2px}
.char{max-width:900px;margin:0 auto}
.char .meta dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem;margin:12px 0}
.char dt{color:var(--muted)}
.rel a{cursor:pointer}
/* graph */
#graph{width:100%;height:calc(100vh - 230px);min-height:520px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;position:relative;overflow:hidden}
#graph svg{width:100%;height:100%;display:block}
#graph .node text{font-size:11px;fill:var(--fg);pointer-events:none;font-family:var(--sans)}
#graph .link{stroke-opacity:.55}
#graph .dim{opacity:.12}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem;color:var(--muted);margin:8px 0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:middle}
.legend i{display:inline-block;width:22px;height:0;border-top:2px solid var(--c);margin-right:5px;vertical-align:middle}
.gpanel{position:absolute;right:10px;top:10px;width:300px;max-height:calc(100% - 20px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;font-size:.88rem;display:none}
.gpanel.on{display:block}
.gpanel h3{font-size:1.1rem}
.gtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.gtools select,.gtools input{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:4px 8px;font:inherit}
/* art */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.wall figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden;cursor:zoom-in}
.wall img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--bg);display:block}
.wall figcaption{padding:6px 8px;font-size:.78rem;color:var(--muted);line-height:1.4}
.wall figcaption b{color:var(--fg);font-weight:500}
.wall figure .gen{display:inline-block;font-size:.7rem;border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:4px;color:var(--muted)}
.sec3{background:var(--bg2);border-left:4px solid var(--accent);border-radius:4px;padding:12px 16px;margin:18px 0}
.sec3 h3{margin:0 0 6px!important;font-size:calc(var(--rf)*1.1)!important}
.sec3 p{margin:0;font-size:calc(var(--rf)*1)!important;line-height:1.9!important}
.entry{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:14px 18px;margin:0 0 20px;cursor:pointer;color:inherit;text-align:left;width:100%}
.entry b{font-family:var(--serif);font-size:1.2rem;color:var(--accent)}
.gsel select,.gsel input{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:4px 8px;font:inherit;max-width:100%}
.gsel{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
/* lightbox */
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;z-index:50;grid-template-columns:1fr 360px}
#lb.on{display:grid}
#lbpic{display:flex;align-items:center;justify-content:center;padding:14px;min-width:0}
#lbpic img{max-width:100%;max-height:calc(100vh - 28px);object-fit:contain}
#lbin{background:var(--panel);padding:18px;overflow:auto;font-size:.92rem}
#lbin h3{font-size:1.15rem;margin-bottom:4px}
#lb .x{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.5);color:#fff;border:0;border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer}
@media (max-width:860px){#lb{grid-template-columns:1fr;grid-template-rows:1fr auto}#lbin{max-height:40vh}}
footer{color:var(--muted);font-size:.8rem;margin-top:40px;border-top:1px solid var(--line);padding-top:12px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><h1 onclick="go('#home')">聖經故事大全</h1><span class="lat">西洋繪畫與雕刻裡的聖經</span><span class="stat" id="stat"></span></div>
  <div class="tabs" role="tablist">
    <button data-v="home">首頁</button><button data-v="stories">故事</button><button data-v="gallery">看圖找故事</button><button data-v="chars">人物</button><button data-v="graph">關係圖</button>
    <span class="sp"></span>
    <button class="tool" id="fontbtn" title="放大字體">字體 A+</button>
    <button class="tool" id="themebtn" title="切換夜間暖色">夜間</button>
  </div>
</div>
<main id="main"></main>
<div id="lb" role="dialog" aria-modal="true"><button class="x" onclick="closeLb()" aria-label="關閉">×</button><div id="lbpic"></div><div id="lbin"></div></div>
<script src="lib/d3.min.js"></script>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const J=n=>fetch('data/'+n+'.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(n);return r.json()});
let ST=[],CH={},ART=[],REL=[],META={},CYC=[];
const SITES=[['西洋藝術流派大全集','https://briantsaivc-web.github.io/art-history-atlas/'],['西洋雕刻演進大全集','https://briantsaivc-web.github.io/sculpture-atlas/'],['希臘神話大全集','https://briantsaivc-web.github.io/greek-myth-atlas/']];
const SITE={p:SITES[0],s:SITES[1]};
const CATC={'神':'#c9a35a','天使':'#9fb7d4','族長':'#b0894a','先知':'#2f8f8f','士師':'#8a9a4a','君王':'#9a62b0','使徒':'#5f86c4','門徒':'#7d9fd0','婦女':'#d08a9a','敵對者':'#b5483f','外邦人':'#9c8a6a','其他':'#8a8a8a'};
const RELC={父母:'#c9a35a',配偶:'#c96b7c',手足:'#7a9cc9',殺害:'#b5483f',師徒:'#8fb08f'};
const artById={}; const artOf=id=>artById[id];
const kindOf=a=>a.site==='s'?'雕刻':'繪畫';
const cycOf=id=>CYC.find(c=>c.id===id);
function stOf(id){return ST.find(s=>s.id===id)}
function storyArt(s){return (s.art||[]).map(artOf).filter(Boolean)}
function charArt(c){return ART.filter(a=>a.chars.includes(c))}
function charStories(c){return ST.filter(s=>s.chars.includes(c))}
function cover(s){const a=storyArt(s)[0];return a?a.thumb:''}
function subject(a){const t=((a.t||'')+' '+(a.z||''));
  if(/Piet[àa]|聖殤/i.test(t))return '聖殤';
  if(/Holy Family|聖家/i.test(t))return '聖家族';
  if(/Madonna|Virgin|聖母/i.test(t))return '聖母與聖嬰';
  if(/Christ|基督/i.test(t))return '基督像';
  if(/Saint|St\.|\bSt |聖/i.test(t))return '聖人';
  return '其他宗教題材'}
function artStories(id){return ST.filter(st=>(st.art||[]).includes(id))}
function go(h){location.hash=h}
function setTab(v){document.querySelectorAll('.tabs [data-v]').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v))}
function route(){
  const h=location.hash||'#home'; const [_,v,id]=h.match(/^#([a-z]+)(?:\/(.+))?$/)||[0,'home'];
  const m=document.getElementById('main'); window.scrollTo(0,0);
  if(v==='home'){setTab('home');m.innerHTML=home()}
  else if(v==='stories'){setTab('stories');m.innerHTML=storyList(id)}
  else if(v==='story'){setTab('stories');m.innerHTML=storyPage(id)}
  else if(v==='chars'){setTab('chars');m.innerHTML=charList(id?decodeURIComponent(id):id)}
  else if(v==='char'){setTab('chars');m.innerHTML=charPage(id)}
  else if(v==='graph'){setTab('graph');m.innerHTML=graphView();setTimeout(()=>drawGraph(id),0)}
  else if(v==='gallery'||v==='art'){setTab('gallery');m.innerHTML=galleryView();applyGallery(true)}
  else m.innerHTML=home();
  m.insertAdjacentHTML('beforeend',`<footer>資料版本 ${esc(META.version||'')}（${esc(META.updated||'')}）。經文出處與背景據聖經與通行學術說明改寫；圖檔取自姊妹站${SITES.map(x=>`<a href="${x[1]}" target="_blank" rel="noopener">${x[0]}</a>`).join('、')}（Wikimedia Commons 公共領域）。<br>姊妹站：${SITES.map(x=>`<a href="${x[1]}" target="_blank" rel="noopener">${x[0]}</a>`).join(' · ')}</footer>`);
}
function home(){
  const pick=ST[Math.floor(Math.random()*ST.length)]; const cov=cover(pick);
  const featured=Object.values(CH).sort((a,b)=>charStories(b.id).length-charStories(a.id).length).slice(0,24);
  return `<section class="hero"><div><div class="lbl">今日一則</div><h2>${esc(pick.title)}</h2><p class="lead" style="margin:4px 0 10px">${esc(pick.summary)}</p><p class="lead" style="font-size:.85rem">${esc(pick.book)} · ${esc(cycOf(pick.cycle)?.zh||'')}</p><button class="big" onclick="go('#story/${pick.id}')">閱讀全文 →</button> <button class="chip" onclick="route()" style="margin-left:8px">換一則</button></div>${cov?`<img src="${esc(cov)}" alt="">`:''}</section>
  <button class="entry" onclick="go('#gallery')"><div><b>看圖找故事</b><div class="lead" style="margin:2px 0 0">看到一幅畫或一件雕刻，不知道畫的是哪一段聖經？從 ${ART.length} 件作品牆找起，點開即可連到背後的故事。</div></div><span style="margin-left:auto;color:var(--accent)">進入 →</span></button>
  <div class="sec"><h2>依篇章</h2><span class="lead" style="margin:0">從創世到啟示錄，${ST.length} 則故事。</span></div>
  <div class="grid">${CYC.map(c=>{const ss=ST.filter(s=>s.cycle===c.id);const a=ss.map(cover).find(Boolean);return `<button class="card cyc" style="--cc:${c.color}" onclick="go('#stories/${c.id}')">${a?`<img src="${esc(a)}" alt="" loading="lazy">`:''}<div class="b"><h3>${esc(c.zh)}</h3><span class="en">${esc(c.en||'')}</span><span class="meta">${ss.length} 則故事</span><span class="sum">${esc(c.desc||'')}</span></div></button>`}).join('')}</div>
  <div class="sec"><h2>人物</h2><a class="more" href="#chars">全部 ${Object.keys(CH).length} 位 →</a></div>
  <div class="chips">${featured.map(c=>`<span class="chip" onclick="go('#char/${c.id}')">${esc(c.zh)}</span>`).join('')}</div>
  <div class="sec"><h2>人物關係圖</h2><a class="more" href="#graph">開啟互動關係圖 →</a></div>
  <p class="lead">族長、君王、先知、使徒之間的父母、配偶、手足、殺害與師徒關係，可拖曳、篩選，點人物看故事。</p>
  <div class="sec"><h2>作品</h2><a class="more" href="#gallery">全部 ${ART.length} 件 →</a></div>
  <div class="strip">${ART.filter(a=>a.chars.length).sort(()=>Math.random()-.5).slice(0,14).map(a=>`<img src="${esc(a.thumb)}" alt="${esc(a.z||a.t)}" loading="lazy" onclick="openLb('${a.id}')">`).join('')}</div>`;
}
function storyCard(s){const c=cycOf(s.cycle);const cv=cover(s);return `<button class="card cyc" style="--cc:${c?.color||'#888'}" onclick="go('#story/${s.id}')">${cv?`<img src="${esc(cv)}" alt="" loading="lazy">`:''}<div class="b"><h3>${esc(s.title)}</h3><span class="en">${esc(s.en)}</span><span class="meta">${esc(s.book)} · ${esc(c?.zh||'')}</span><span class="sum">${esc(s.summary)}</span></div></button>`}
function storyList(cid){
  const list=cid?ST.filter(s=>s.cycle===cid):ST; const c=cycOf(cid);
  return `<button class="back" onclick="go('#home')">← 首頁</button><div class="sec"><h2>${esc(c?c.zh:'全部故事')}</h2><span class="lead" style="margin:0">${list.length} 則</span></div>${c?`<p class="lead">${esc(c.desc||'')}</p>`:''}
  <div class="chips"><span class="chip ${!cid?'on':''}" onclick="go('#stories')">全部</span>${CYC.map(x=>`<span class="chip ${x.id===cid?'on':''}" onclick="go('#stories/${x.id}')">${esc(x.zh)}</span>`).join('')}<input id="sq" placeholder="搜尋故事或人物…" style="margin-left:auto;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font:inherit;font-size:.85rem" oninput="filterStories(this.value)"></div>
  <div class="grid" id="sgrid">${list.map(storyCard).join('')}</div>`;
}
function filterStories(q){q=(q||'').trim();const h=location.hash.match(/^#stories\/(.+)$/);const cid=h?h[1]:null;let list=cid?ST.filter(s=>s.cycle===cid):ST;if(q)list=list.filter(s=>(s.title+s.en+s.book+s.summary+s.chars.map(c=>CH[c]?CH[c].zh+CH[c].en:'').join('')).toLowerCase().includes(q.toLowerCase()));document.getElementById('sgrid').innerHTML=list.map(storyCard).join('')||'<p class="lead">沒有符合的故事。</p>'}
function figHtml(a){return `<figure onclick="openLb('${a.id}')"><img src="${esc(a.img)}" alt="${esc(a.z||a.t)}" loading="lazy"><figcaption>${esc(a.a_zh||a.a)}《${esc(a.z||a.t)}》${a.y?' · '+esc(a.y):''}${a.mu?' · '+esc(a.mu):''} · ${kindOf(a)}</figcaption></figure>`}
function storyPage(id){
  const s=stOf(id); if(!s) return '<p>找不到這則故事。</p>';
  const c=cycOf(s.cycle); const arts=storyArt(s); const idx=ST.indexOf(s); const prev=ST[idx-1],next=ST[idx+1];
  const secs=s.sections.map(x=>`<h3>${esc(x.h)}</h3>${x.p.map(p=>`<p>${esc(p)}</p>`).join('')}`).join('');
  return `<article class="story"><button class="back" onclick="go('#stories/${s.cycle}')">← ${esc(c?.zh||'故事')}</button>
  <div class="head"><h2>${esc(s.title)}</h2><div class="en">${esc(s.en)}</div><div class="meta"><span>${esc(s.book)}</span><span>${s.canon==='ot'?'舊約':s.canon==='nt'?'新約':'次經'}</span><span>第 ${s.n} 則</span></div>
  <div class="chips">${s.chars.map(cid=>CH[cid]?`<span class="chip" onclick="go('#char/${cid}')">${esc(CH[cid].zh)}</span>`:'').join('')}</div></div>
  <p class="hook">${esc(s.hook)}</p>${arts[0]?figHtml(arts[0]):''}${secs}
  <div class="ending">${esc(s.ending)}</div>
  ${s.moral?`<div class="note"><b>主題</b>　${esc(s.moral)}</div>`:''}
  <div class="sec3"><h3>經文出處</h3><p>${esc(s.scripture)}</p></div>
  <div class="sec3"><h3>背景</h3><p>${esc(s.context)}</p></div>
  <div class="sec3"><h3>在藝術中如何辨認</h3><p>${esc(s.in_art)}</p></div>
  ${arts.length?`<div class="sec"><h2 style="font-size:1.1rem">相關作品（${arts.length}）</h2></div><div class="strip">${arts.map(a=>`<img src="${esc(a.thumb)}" alt="${esc(a.z||a.t)}" loading="lazy" onclick="openLb('${a.id}')">`).join('')}</div>`:''}
  <div class="nav2">${prev?`<button onclick="go('#story/${prev.id}')">← ${esc(prev.title)}</button>`:'<span></span>'}${next?`<button onclick="go('#story/${next.id}')">${esc(next.title)} →</button>`:''}</div></article>`;
}
function charList(cat){
  const cats=[...new Set(Object.values(CH).map(c=>c.cat))].sort((a,b)=>Object.keys(CATC).indexOf(a)-Object.keys(CATC).indexOf(b));
  const list=Object.values(CH).filter(c=>!cat||c.cat===cat).sort((a,b)=>(charStories(b.id).length+charArt(b.id).length)-(charStories(a.id).length+charArt(a.id).length));
  return `<div class="sec"><h2>人物</h2><span class="lead" style="margin:0">${list.length} 位</span></div><div class="chips"><span class="chip ${!cat?'on':''}" onclick="go('#chars')">全部</span>${cats.map(x=>`<span class="chip ${x===cat?'on':''}" onclick="go('#chars/${encodeURIComponent(x)}')">${esc(x)}</span>`).join('')}</div>
  <div class="cgrid">${list.map(c=>`<button class="ccard" style="border-left:4px solid ${CATC[c.cat]||'#888'}" onclick="go('#char/${c.id}')"><h3>${esc(c.zh)}</h3><div class="en">${esc(c.en)}</div><div class="d">${esc(c.cat)}</div><div class="d">${charStories(c.id).length} 則故事 · ${charArt(c.id).length} 件作品</div></button>`).join('')}</div>`;
}
function relList(c){
  const row=(k,ids)=>ids&&ids.length?`<dt>${k}</dt><dd class="rel">${ids.map(i=>CH[i]?`<a onclick="go('#char/${i}')">${esc(CH[i].zh)}</a>`:esc(i)).join('、')}</dd>`:'';
  return row('父母',c.parents)+row('配偶',c.spouses)+row('子女',c.children)+row('手足',c.siblings)+row('殺死',c.killed)+row('被殺於',c.killed_by)+row('師徒',c.mentor_of);
}
function charPage(id){
  const c=CH[id]; if(!c) return '<p>找不到這位人物。</p>';
  const ss=charStories(id), arts=charArt(id);
  return `<article class="char"><button class="back" onclick="go('#chars')">← 人物</button><h2 style="font-size:1.8rem">${esc(c.zh)}</h2><div class="en" style="font-family:var(--latin);font-style:italic;color:var(--muted);font-size:1.15rem">${esc(c.en)}</div>
  <div class="chips"><span class="chip" style="border-color:${CATC[c.cat]||'#888'}">${esc(c.cat)}</span><span class="chip" onclick="go('#graph/${id}')">在關係圖中查看</span></div>
  <p>${esc(c.bio||'')}</p>${c.note?`<div class="note"><b>在藝術中</b>　${esc(c.note)}</div>`:''}
  <div class="meta"><dl>${relList(c)}</dl></div>
  ${ss.length?`<div class="sec"><h2 style="font-size:1.2rem">相關故事（${ss.length}）</h2></div><div class="grid">${ss.map(storyCard).join('')}</div>`:''}
  ${arts.length?`<div class="sec"><h2 style="font-size:1.2rem">藝術作品（${arts.length}）</h2></div><div class="wall">${arts.map(wallFig).join('')}</div>`:''}</article>`;
}
function wallFig(a){return `<figure onclick="openLb('${a.id}')"><img src="${esc(a.thumb)}" alt="${esc(a.z||a.t)}" loading="lazy"><figcaption><b>${esc(a.z||a.t)}</b>${a.generic?`<span class="gen">${esc(subject(a))}</span>`:''}<br>${esc(a.a_zh||a.a)}${a.y?' · '+esc(a.y):''} · ${kindOf(a)}</figcaption></figure>`}
function graphView(){
  return `<div class="sec"><h2>人物關係圖</h2><span class="lead" style="margin:0">拖曳節點、滾輪縮放；點人物看關係與故事。</span></div>
  <div class="gtools"><select id="gcat"><option value="">所有類別</option>${Object.keys(CATC).map(k=>`<option>${k}</option>`).join('')}</select><select id="grel"><option value="">所有關係</option>${Object.keys(RELC).map(k=>`<option>${k}</option>`).join('')}</select><input id="gq" placeholder="搜尋人物…" list="gnames"><datalist id="gnames">${Object.values(CH).map(c=>`<option value="${esc(c.zh)}">`).join('')}</datalist><label style="font-size:.85rem;color:var(--muted)"><input type="checkbox" id="gmain" checked> 只顯示有關係連線的人物</label></div>
  <div class="legend">${Object.entries(CATC).map(([k,v])=>`<span style="--c:${v}">${k}</span>`).join('')}${Object.entries(RELC).map(([k,v])=>`<span style="--c:${v}"><i></i>${k}</span>`).join('')}</div>
  <div id="graph"><div class="gpanel" id="gpanel"></div></div>`;
}
let sim=null;
function drawGraph(focus){
  const box=document.getElementById('graph'); if(!box) return;
  const cat=document.getElementById('gcat').value, rel=document.getElementById('grel').value, onlyMain=document.getElementById('gmain').checked;
  ['gcat','grel','gmain'].forEach(i=>document.getElementById(i).onchange=()=>drawGraph(focus));
  document.getElementById('gq').onchange=e=>{const c=Object.values(CH).find(x=>x.zh===e.target.value);if(c)go('#graph/'+c.id)};
  const linked=new Set();REL.forEach(r=>{linked.add(r.s);linked.add(r.t)});
  let nodes=Object.values(CH).filter(c=>!onlyMain||linked.has(c.id)||c.id===focus);
  if(cat) nodes=nodes.filter(c=>c.cat===cat||c.id===focus);
  const ids=new Set(nodes.map(n=>n.id));
  let links=REL.filter(r=>ids.has(r.s)&&ids.has(r.t)&&(!rel||r.k===rel));
  if(focus&&CH[focus]){const nb=new Set([focus]);links.forEach(l=>{if(l.s===focus)nb.add(l.t);if(l.t===focus)nb.add(l.s)});links=links.filter(l=>nb.has(l.s)&&nb.has(l.t));nodes=nodes.filter(n=>nb.has(n.id));}
  box.querySelector('svg')?.remove();
  const W=box.clientWidth,H=box.clientHeight;
  const svg=d3.select(box).insert('svg',':first-child').attr('viewBox',[0,0,W,H]);
  const g=svg.append('g'); svg.call(d3.zoom().scaleExtent([.3,4]).on('zoom',e=>g.attr('transform',e.transform)));
  const deg={}; links.forEach(l=>{deg[l.s]=(deg[l.s]||0)+1;deg[l.t]=(deg[l.t]||0)+1});
  const N=nodes.map(n=>({id:n.id,zh:n.zh,cat:n.cat,r:6+Math.min(14,(deg[n.id]||0)*1.2+charStories(n.id).length*.3)}));
  const L=links.map(l=>({source:l.s,target:l.t,k:l.k}));
  if(sim) sim.stop();
  sim=d3.forceSimulation(N).force('link',d3.forceLink(L).id(d=>d.id).distance(d=>d.k==='父母'?70:55).strength(.6)).force('charge',d3.forceManyBody().strength(-220)).force('center',d3.forceCenter(W/2,H/2)).force('collide',d3.forceCollide(d=>d.r+14));
  const link=g.append('g').selectAll('line').data(L).join('line').attr('class','link').attr('stroke',d=>RELC[d.k]||'#888').attr('stroke-width',d=>d.k==='父母'?1.6:1.2).attr('stroke-dasharray',d=>d.k==='殺害'?'6 3':null);
  const node=g.append('g').selectAll('g').data(N).join('g').attr('class','node').style('cursor','pointer').call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));
  node.append('circle').attr('r',d=>d.r).attr('fill',d=>CATC[d.cat]||'#888').attr('stroke',d=>d.id===focus?'#fff':'rgba(0,0,0,.4)').attr('stroke-width',d=>d.id===focus?3:1);
  node.append('text').attr('dy',d=>d.r+12).attr('text-anchor','middle').text(d=>d.zh);
  node.on('click',(e,d)=>showPanel(d.id)).on('mouseover',(e,d)=>{const nb=new Set([d.id]);L.forEach(l=>{if(l.source.id===d.id)nb.add(l.target.id);if(l.target.id===d.id)nb.add(l.source.id)});node.classed('dim',n=>!nb.has(n.id));link.classed('dim',l=>l.source.id!==d.id&&l.target.id!==d.id)}).on('mouseout',()=>{node.classed('dim',false);link.classed('dim',false)});
  sim.on('tick',()=>{link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);node.attr('transform',d=>`translate(${d.x},${d.y})`)});
  if(focus&&CH[focus]) showPanel(focus); else document.getElementById('gpanel').classList.remove('on');
}
function showPanel(id){const c=CH[id];const p=document.getElementById('gpanel');p.classList.add('on');const ss=charStories(id);p.innerHTML=`<h3>${esc(c.zh)} <span style="font-family:var(--latin);font-style:italic;color:var(--muted);font-weight:400">${esc(c.en)}</span></h3><div style="color:var(--muted);font-size:.8rem">${esc(c.cat)}</div><p style="margin:8px 0">${esc(c.bio||'')}</p><dl style="display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.85rem">${relList(c)}</dl>${ss.length?`<div class="lbl" style="margin-top:8px">故事</div>${ss.slice(0,12).map(s=>`<div><a href="#story/${s.id}">${esc(s.title)}</a></div>`).join('')}${ss.length>12?`<div style="color:var(--muted)">…共 ${ss.length} 則</div>`:''}`:''}<div style="margin-top:10px;display:flex;gap:8px"><button class="chip" onclick="go('#graph/${id}')">只看此人關係</button><button class="chip" onclick="go('#char/${id}')">人物頁</button><button class="chip" onclick="go('#graph')">全圖</button></div>`}
/* 看圖找故事 */
const GF={cyc:'',ch:'',kind:'',sub:'',q:'',n:120};
function galleryView(){
  const chs=Object.values(CH).map(c=>[c,charArt(c.id).length]).filter(x=>x[1]>=1).sort((a,b)=>b[1]-a[1]);
  const subs=['聖母與聖嬰','聖家族','聖人','基督像','聖殤','其他宗教題材'];
  return `<div class="sec"><h2>看圖找故事</h2><span class="lead" style="margin:0" id="gcount"></span></div>
  <p class="lead">瀏覽來自兩個大全集的繪畫與雕刻；點作品看大圖，並連到它所畫的聖經故事。尚未對應到特定故事的作品（如聖母像、聖人像），標示其題材分類。</p>
  <div class="gsel"><select id="fc" onchange="GF.cyc=this.value;applyGallery()"><option value="">所有篇章</option>${CYC.map(c=>`<option value="${c.id}">${esc(c.zh)}</option>`).join('')}</select>
  <select id="fh" onchange="GF.ch=this.value;applyGallery()"><option value="">所有人物</option>${chs.map(([c,n])=>`<option value="${c.id}">${esc(c.zh)}（${n}）</option>`).join('')}</select>
  <select id="fk" onchange="GF.kind=this.value;applyGallery()"><option value="">繪畫與雕刻</option><option value="p">繪畫</option><option value="s">雕刻</option></select>
  <select id="fs" onchange="GF.sub=this.value;applyGallery()"><option value="">所有題材</option><option value="story">已對應故事</option>${subs.map(x=>`<option>${x}</option>`).join('')}</select>
  <input id="fq" placeholder="搜尋題名、藝術家…" oninput="GF.q=this.value;applyGallery()" style="min-width:200px"></div>
  <div class="wall" id="gwall"></div><div style="text-align:center;margin:18px"><button class="chip" id="gmore" onclick="GF.n+=120;applyGallery(false,true)">顯示更多</button></div>`;
}
let _artCyc=null;
function artCycles(){if(_artCyc)return _artCyc;_artCyc={};ST.forEach(s=>(s.art||[]).forEach(id=>(_artCyc[id]=_artCyc[id]||new Set()).add(s.cycle)));return _artCyc}
function applyGallery(init,more){
  if(init){document.getElementById('fc').value=GF.cyc;document.getElementById('fh').value=GF.ch;document.getElementById('fk').value=GF.kind;document.getElementById('fs').value=GF.sub;document.getElementById('fq').value=GF.q}
  if(!more)GF.n=120;
  const ac=artCycles(),q=GF.q.trim().toLowerCase();
  const list=ART.filter(a=>{
    if(GF.cyc&&!(ac[a.id]&&ac[a.id].has(GF.cyc)))return false;
    if(GF.ch&&!a.chars.includes(GF.ch))return false;
    if(GF.kind&&a.site!==GF.kind)return false;
    if(GF.sub==='story'&&a.generic)return false;
    if(GF.sub&&GF.sub!=='story'&&!(a.generic&&subject(a)===GF.sub))return false;
    if(q&&!((a.t||'')+(a.z||'')+(a.a||'')+(a.a_zh||'')).toLowerCase().includes(q))return false;
    return true});
  document.getElementById('gcount').textContent=`${list.length} 件`;
  document.getElementById('gwall').innerHTML=list.slice(0,GF.n).map(wallFig).join('')||'<p class="lead">沒有符合的作品。</p>';
  document.getElementById('gmore').style.display=list.length>GF.n?'':'none';
}
function openLb(id){const a=artOf(id);if(!a)return;const s=SITE[a.site];const stories=artStories(id);
  document.getElementById('lbpic').innerHTML=`<img src="${esc(a.img)}" alt="${esc(a.z||a.t)}">`;
  document.getElementById('lbin').innerHTML=`<h3>${esc(a.z||a.t)}</h3><div style="font-family:var(--latin);font-style:italic;color:var(--muted)">${esc(a.t)}</div><p style="margin:10px 0 4px"><b>${esc(a.a_zh||a.a)}</b>${a.a_zh?` · ${esc(a.a)}`:''}</p><p style="margin:0;color:var(--muted)">${esc(a.y||'')}${a.mu?' · '+esc(a.mu):''}${a.mat?' · '+esc(a.mat):''} · ${kindOf(a)}</p>
  ${a.generic?`<p style="margin:10px 0"><span class="chip">題材：${esc(subject(a))}</span></p>`:''}
  ${a.chars.length?`<div class="chips">${a.chars.map(c=>CH[c]?`<span class="chip" onclick="closeLb();go('#char/${c}')">${esc(CH[c].zh)}</span>`:'').join('')}</div>`:''}
  <div class="lbl" style="margin-top:10px">這幅作品的故事</div>${stories.length?stories.map(st=>`<div><a href="#story/${st.id}" onclick="closeLb()">${esc(st.title)}</a> <span style="color:var(--muted);font-size:.8rem">${esc(st.book)}</span></div>`).join(''):'<div style="color:var(--muted)">尚未對應到特定故事。</div>'}
  <p style="margin-top:14px;font-size:.85rem"><a href="${esc(s.url||s[1])}#work/${esc(a.wid)}" target="_blank" rel="noopener">在${esc(s.name||s[0])}開啟此作品（含高解析度大圖）→</a></p>${a.src_url?`<p style="font-size:.8rem"><a href="${esc(a.src_url)}" target="_blank" rel="noopener">圖檔來源頁</a></p>`:''}${a.wd_flag?'<p style="font-size:.8rem;color:var(--danger)">原站標示此圖與條目資料有待核對之處。</p>':''}`;
  document.getElementById('lb').classList.add('on');document.body.style.overflow='hidden'}
function closeLb(){document.getElementById('lb').classList.remove('on');document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLb()});
document.getElementById('lb').addEventListener('click',e=>{if(e.target.id==='lbpic')closeLb()});
document.querySelectorAll('.tabs [data-v]').forEach(b=>b.onclick=()=>go('#'+b.dataset.v));
let fs=1;document.getElementById('fontbtn').onclick=()=>{fs=fs>=1.5?1:fs+.25;document.documentElement.style.setProperty('--rf',fs+'rem');try{localStorage.setItem('rf',fs)}catch(e){}};
document.getElementById('themebtn').onclick=()=>{const r=document.documentElement;const t=r.dataset.theme==='night'?'':'night';if(t)r.dataset.theme=t;else delete r.dataset.theme;try{localStorage.setItem('theme',t)}catch(e){}};
try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;const f=parseFloat(localStorage.getItem('rf'));if(f){fs=f;document.documentElement.style.setProperty('--rf',fs+'rem')}}catch(e){}
(async()=>{
  const [st,ch,art,rel,meta]=await Promise.all([J('stories'),J('characters'),J('artworks'),J('relations'),J('meta')]);
  ST=st;CH=ch;ART=art;REL=rel;META=meta;CYC=meta.cycles||[];ART.forEach(a=>artById[a.id]=a);
  document.getElementById('stat').textContent=`${ST.length} 則故事 · ${Object.keys(CH).length} 位人物 · ${ART.length} 件作品`;
  window.addEventListener('hashchange',route);route();
})().catch(e=>{document.getElementById('main').innerHTML='<p>資料載入失敗：'+esc(e.message)+'</p>'});
</script>
